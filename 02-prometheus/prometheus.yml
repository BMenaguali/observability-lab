global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "192.168.200.10:9100"

  - job_name: "frontend-service"
    static_configs:
      - targets:
          - "192.168.200.10:5000"

  - job_name: "backend-service"
    static_configs:
      - targets:
          - "192.168.200.10:5001"
